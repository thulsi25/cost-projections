<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Projections · Office Tools prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* ---------- Modus-named tokens (Modus 2.0 values) ---------- */
:root{
  --primary:#0063A3; --primary-dark:#004F83; --primary-pale:#DCEDF9; --primary-bg:#F2F7FB;
  --text:#171C1E; --text-muted:#6A6E79; --text-faint:#90939F;
  --bg:#FFFFFF; --level1:#F1F1F6; --level2:#E0E1E9; --level2b:#E9EAF0; --level3:#CBCDD6; --page:#FAFAFB;
  --warning:#E49325; --warning-dark:#B35C00; --warning-pale:#FFF5E4;
  --success:#1E8A44; --success-dark:#006638; --success-pale:#E0ECCF;
  --error:#DA212C; --error-dark:#AB1F26; --error-pale:#FBD4D7;
  --zebra:rgba(241,241,246,.4); --sel:#E7F0F8;
  --radius:8px; --radius-lg:16px;
  --shadow:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -2px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Open Sans',Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg);line-height:1.4}
a{color:var(--primary)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

/* ---------- multiple drafts & saved views (per Figma) ---------- */
.btn:disabled{opacity:.45;cursor:not-allowed}
.chevbtn{width:22px;height:22px;border:0;background:none;border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;margin-right:6px;vertical-align:middle;color:var(--text);padding:0}
.chevbtn:hover{background:var(--level2b)}
.chevbtn svg{width:14px;height:14px;transition:transform .15s;transform:rotate(0deg)}
.chevbtn.open svg{transform:rotate(180deg)}
.chevbtn.ph{visibility:hidden}
.countchip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:9999px;border:0;color:var(--text);font-size:12px;font-weight:600;background:var(--level2b);margin-left:6px;vertical-align:middle}
table.grid tr.grp td{background:var(--level1) !important}
table.grid tr.draftrow td{background:var(--level1) !important;border-right-color:var(--level1) !important}
table.grid tr.draftrow td.stickyend{border-right-color:var(--level1) !important}
table.grid tr.draftrow td.action{border-left-color:var(--level1) !important}
tr.draftrow td:first-child::after{content:'';position:absolute;left:-1px;top:0;bottom:-1px;width:1px;background:var(--level1)}
.badge.primary{height:18px;padding:0 8px;border:0;background:var(--primary);color:#fff;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
.badge.primary.sq{border-radius:4px;height:24px;font-size:12px}
.kebabbtn{width:24px;height:24px;border:0;background:none;border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;color:var(--text);font-size:15px;font-weight:700;padding:0;vertical-align:middle}
.kebabbtn:hover{background:var(--level1)}
.draftsw{display:inline-flex;align-items:center;gap:8px;height:32px;border:1px solid var(--level2b);border-radius:8px;padding:0 12px;background:#fff;cursor:pointer;font-weight:600;font-size:14px;margin-left:8px;color:var(--text)}
.draftsw:hover{border-color:var(--level3)}
.btn.default{background:#F5F5F8;border:0;color:var(--text);font-weight:600}
.btn.default:hover{background:var(--level2b)}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:4px}
.linkbtn:hover{text-decoration:underline}
/* draft switcher menu (Figma: radius 4, #CBCDD6 stroke, 0 4 12 16% shadow) */
.dmenu{position:absolute;background:#fff;border:1px solid var(--level3);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.16);min-width:360px;padding:4px;z-index:45}
.dmenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;text-align:left;border:0;background:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:14px;line-height:20px;color:var(--text)}
.dmenu button:hover{background:var(--level1)}
.dmenu button small{display:block;color:var(--text-muted);font-size:10px;line-height:14px}
.dmenu button svg{width:16px;height:16px;flex:0 0 16px}
.dmenu .div{height:1px;background:var(--level3);margin:4px 0}
/* modal per Figma (536 wide, 24 padding, X close, checkbox footer) */
.modal .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal .mhead h3{font-size:18px;font-weight:700}
.modal .mdesc{font-size:16px;margin:0;color:var(--text)}
.modal .mlabel{font-size:12px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px}
.modal .chk{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer;margin-right:auto}
.modal .chk input{width:16px;height:16px;accent-color:var(--primary)}
.btn.md{height:40px;padding:0 16px;font-size:16px;font-weight:600;border-radius:8px}
.tipwrap{position:relative;display:inline-flex}
.tipwrap[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);right:0;background:#252A2E;color:#fff;font-size:12px;line-height:16px;font-weight:400;padding:6px 10px;border-radius:4px;white-space:nowrap;z-index:80;box-shadow:var(--shadow)}
.tipwrap[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 3px);right:24px;border:6px solid transparent;border-top-color:#252A2E;z-index:80}
/* ---------- top nav ---------- */
.topnav{height:60px;display:flex;align-items:center;gap:16px;padding:6px 12px;border-bottom:1px solid var(--level2);background:#fff;position:fixed;top:0;left:0;right:0;z-index:20}
.topnav .hamb{width:32px;height:32px;border:0;background:var(--level1);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.topnav .brand{display:flex;align-items:center;gap:8px;font-size:11px;line-height:1.1;color:var(--text-muted)}
.topnav .brand b{display:block;color:var(--text);font-size:12px}
.topnav .spacer{flex:1}
.topnav .company{height:32px;padding:0 12px;border:0;background:var(--level1);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.topnav .avatar{width:32px;height:32px;border-radius:50%;background:#171C1E;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.proto{position:relative}
.proto>button{height:32px;border:1px dashed var(--level3);background:transparent;border-radius:6px;padding:0 10px;font-size:12px;color:var(--text-muted);cursor:pointer}
.proto .pm{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--level2);border-radius:8px;box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:60}
.proto .pm button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.proto .pm button:hover{background:var(--level1)}

/* ---------- page shell ---------- */
.page{padding:16px 64px 24px;padding-top:76px;display:flex;flex-direction:column;gap:16px;min-height:calc(100% - 60px)}
.pagehead{display:flex;align-items:center;gap:8px;min-height:40px;position:sticky;top:60px;z-index:15;background:#fff;margin:-16px -64px 0;padding:8px 64px;border-bottom:1px solid transparent}
.pagehead h1{font-size:18px;line-height:28px}
.pagehead .back{width:32px;height:32px;border:0;background:none;cursor:pointer;border-radius:6px;display:grid;place-items:center}
.pagehead .back:hover{background:var(--level1)}
.pagehead .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.primary:disabled{background:var(--primary-pale);color:#fff;cursor:not-allowed;opacity:.9}
.btn.outline{border-color:var(--level3);background:#fff}
.btn.outline:hover{background:var(--level1)}
.btn.outline.primary-outline{border-color:var(--primary);color:var(--primary);background:#fff}
.btn.ghost:hover{background:var(--level1)}
.btn.chip{background:var(--level1)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.icon.sm{width:28px}
.btn.icon.xs{width:24px}
.btn.danger{background:var(--error);color:#fff}
.btn.link{color:var(--primary);padding:0;height:auto;font-weight:600}
.btn svg{width:16px;height:16px;flex:none}
.btn.xs svg{width:14px;height:14px}
.toggle{display:inline-flex;border:1px solid var(--level3);border-radius:6px;overflow:hidden}
.toggle button{width:32px;height:32px;border:0;background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--text-muted)}
.toggle button.on{background:var(--level1);color:var(--text)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--level2b);border-radius:16px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:157px}
.card .label{font-size:12px;line-height:24px;font-weight:600;letter-spacing:0;text-transform:uppercase;color:var(--text-muted);display:flex;justify-content:space-between;align-items:baseline}
.card .label span{font-size:12px;text-transform:none;font-weight:400;color:var(--text)}
.card .big{display:flex;align-items:baseline;gap:12px}
.card .big b{font-size:40px;line-height:44px;font-weight:700}
.card .big span{font-size:16px;color:var(--text)}
.card .pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--text);background:var(--level2b);font-size:12px;line-height:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.pill.on{box-shadow:0 0 0 2px var(--primary-pale)}
.pill.draft{}
.pill.submitted{border-color:var(--primary);color:var(--primary);background:var(--primary-pale)}
.pill.approved{border-color:var(--success-dark);color:var(--success-dark);background:var(--success-pale)}
.pill.yet{background:#fff}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--level3)}
.card.selected{background:var(--primary-bg);border-color:var(--primary)}
.toplist{display:flex;flex-direction:column;gap:8px}
.toplist a{display:flex;align-items:center;gap:20px;color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums;font-size:14px;line-height:24px}
.toplist a:hover{text-decoration:underline}
.toplist .code{width:36px;font-weight:600;color:var(--primary)}
.toplist .desc{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.toplist .amt{font-weight:600;color:var(--error-dark)}
.toplist .pct{width:44px;text-align:right;font-weight:600;color:var(--error-dark)}
.warnline{color:var(--warning);font-weight:600;font-size:12px;display:flex;align-items:center;gap:8px}

/* ---------- period block (landing) ---------- */
.block{border:1px solid var(--level2);border-radius:8px;padding:16px;background:rgba(241,241,246,.32)}
.input{height:32px;border:1px solid var(--level3);border-radius:6px;background:#fff;padding:0 36px 0 12px;font:inherit;font-size:14px;width:343px;appearance:none;-webkit-appearance:none}
.inputwrap{position:relative;width:343px}.inputwrap svg{position:absolute;right:10px;top:8px;width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.field label{display:block;font-size:12px;line-height:20px;color:var(--text-muted);margin-bottom:4px}
.field .req{color:var(--error)}
.select{height:32px;border:1px solid var(--level3);border-radius:6px;background:#fff;padding:0 12px;font:inherit;font-size:14px;min-width:168px}

/* ---------- toolbar ---------- */
.toolbar{height:40px;border:1px solid var(--level2);border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;position:sticky;top:108px;z-index:14}
.toolbar .div{width:1px;height:24px;background:var(--level2);margin:0 4px}
.toolbar .view{display:inline-flex;align-items:center;gap:8px;height:28px;border:1px solid var(--level3);border-radius:6px;padding:0 10px;background:#fff;cursor:pointer}
.toolbar .view small{color:var(--text-muted)}
.seltrig{height:32px;min-width:168px;border:1px solid var(--level3);border-radius:6px;background:#fff;padding:0 12px 0 12px;font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.seltrig svg{width:14px;height:14px;flex:none}

/* ---------- container ---------- */
.container{border:1px solid var(--level2);border-radius:8px;background:#fff;padding:0;display:flex;flex-direction:column;gap:0;overflow:visible}
.gridhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px 0}
.gridhead h2{font-size:14px;font-weight:600}
.gridhead h2 small{font-weight:400;color:var(--text-muted);margin-left:8px;font-size:12px}
.gridhead .right{display:flex;gap:8px;align-items:center}

/* ---------- grid ---------- */
.gridwrap{position:relative;border:1px solid var(--level2);border-radius:8px;overflow:auto;max-height:var(--gh,520px);background:#fff}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed;border:0}
table.grid tr>:last-child{border-right:0}
table.grid tbody:last-child tr:last-child td,table.grid tfoot tr:last-child td{border-bottom:0}
table.grid th,table.grid td{border-right:1px solid var(--level2);border-bottom:1px solid var(--level2);padding:0 16px;height:40px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:20px}
table.grid.compact td{font-size:12px}
.has-alert .toolbar{top:152px}
.has-alert .alert{top:108px}
table.grid thead th{position:sticky;top:0;z-index:3;font-weight:600;text-align:left;border-bottom-width:1px;height:40px;background:#fff;color:#252A2E;font-size:13px}
table.grid thead tr:first-child th{border-bottom:4px solid var(--level2b)}
table.grid thead tr th{border-bottom:1px solid var(--level2)}
table.grid thead tr.filter th{top:40px;height:28px;border-bottom:1px solid var(--level2);padding:0 8px;z-index:3;background:#fff}
table.grid thead tr.filter th svg{width:12px;height:12px;color:var(--text)}
table.grid td.num,table.grid th.num{text-align:right}
table.grid tbody tr.zebra td{background:var(--level1)}
table.grid tbody tr.zebra td{background:#FAFAFC}
table.grid tbody tr.sel td{background:#EDF4FB}
table.grid tbody tr:hover td{filter:brightness(.985)}
table.grid td.sticky,table.grid th.sticky{position:sticky;z-index:2}
table.grid thead th.sticky{z-index:4}
table.grid .stickyend{border-right:4px solid var(--level2)}
table.grid td.action,table.grid th.action{position:sticky;right:0;z-index:2;border-left:4px solid var(--level2);border-right:0;text-align:center;padding:0 12px;text-overflow:clip}
table.grid thead th.action{z-index:4}
table.grid tfoot td{position:sticky;bottom:0;z-index:3;font-weight:600;background:#fff;border-top:4px solid var(--level2b)}
table.grid tfoot td.sticky{z-index:5}
table.grid td.editable{cursor:text}
table.grid td.editable:hover{box-shadow:inset 0 0 0 1px var(--primary)}
table.grid td.editing{padding:0}
table.grid td.editing input{width:100%;height:100%;border:0;outline:2px solid var(--primary);outline-offset:-2px;padding:0 16px;font:inherit;text-align:right;background:#fff}
table.grid td.mod{font-weight:600}
table.grid td.held{color:var(--text-faint)}
table.grid td.pos{color:var(--error)}
table.grid td.neg{color:var(--success)}
table.grid td.drift{background:var(--warning-pale)!important;box-shadow:inset 0 0 0 1px var(--warning)}
table.grid td.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--success-pale)}70%{background:var(--success-pale)}100%{background:inherit}}
table.grid td.codecell .codewrap{display:flex;align-items:center;justify-content:space-between;gap:6px}
table.grid td.codecell .codelink{color:var(--primary);font-weight:600}
table.grid td.codecell.selcode .codelink{color:var(--text)}
table.grid td.codecell .caret{font-size:12px;color:var(--text)}
table.grid td .ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:6px;color:var(--warning-dark)}
table.grid th .ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:8px;color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;height:24px;padding:2px 8px;border-radius:9999px;border:1px solid var(--text);font-size:12px;line-height:16px;font-weight:600;background:var(--level2b)}
.badge.draft{border-color:var(--text)}
.badge.submitted{border-color:var(--primary);color:var(--primary);background:var(--primary-pale)}
.badge.approved,.badge.posted{border-color:var(--success-dark);color:var(--success-dark);background:var(--success-pale)}
.badge.yet{border-color:var(--text);background:#fff}
.bar{display:inline-flex;align-items:center;gap:8px}
.bar i{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--level2);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--primary)}
.notif.warn{color:var(--warning);font-weight:600}

/* ---------- split ---------- */
.split{display:flex;gap:0;align-items:stretch;position:relative}
.split>.left{padding:16px}
.split.vertical{flex-direction:column}
.split .divhandle{width:9px;display:flex;align-items:center;justify-content:center;cursor:col-resize;flex:none;background:transparent;position:relative;z-index:6}
.split .divhandle::before{content:'';position:absolute;left:4px;top:16px;bottom:16px;width:1px;background:var(--level2)}
.split .divhandle .grip{width:3px;height:32px;border-radius:2px;background:var(--level3);opacity:0;transition:opacity .15s}
.split .divhandle:hover .grip{opacity:1;background:var(--primary)}
.split.vertical .divhandle{width:100%;height:9px;cursor:row-resize}
.split.vertical .divhandle::before{left:0;right:0;top:4px;bottom:auto;width:auto;height:1px}
.split.vertical .divhandle .grip{width:32px;height:3px;opacity:0}
.split.vertical .divhandle:hover .grip{opacity:1}
.split>.left{flex:1 1 50%;min-width:0}
.split.vertical>.left{flex:1 1 auto;width:100%}
.split>.pane{flex:1 1 50%;min-width:0;border-left:0;padding:16px;display:flex;flex-direction:column;gap:0;align-self:stretch;background:#fff;overflow:hidden}
.split.vertical>.pane{border-left:0;border-top:0;padding:16px;width:100%;background:#fff}
.pane .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px 0}
.pane .ph h3{font-size:14px;font-weight:600}
.pane .ph h3{font-size:16px}
.pane .ph .sub{font-size:13px;color:var(--text-muted)}
.pane .note{font-size:12px;color:var(--text-muted)}

/* ---------- header block (draft) ---------- */
.hdrblock{border:1px solid var(--level2);border-radius:var(--radius);padding:20px 24px;background:#fff;display:flex;flex-direction:column;gap:20px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start}
.meta .k{font-size:13px;color:var(--text-muted);margin-bottom:6px}
.meta .v{font-size:15px}
.contract{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.ccard{border:1px solid var(--level2);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:#fff}
.ccard.working{background:var(--primary-bg);border-color:var(--primary)}
.ccard .t{font-weight:600}
.ccard .t small{font-weight:400;color:var(--text-muted);margin-left:6px}
.ccard .row{display:flex;justify-content:space-between;font-size:14px}
.ccard .row span:first-child{color:var(--text-muted)}
.ccard .row b{font-weight:600;font-variant-numeric:tabular-nums}
.ccard .row .delta{font-size:12px;margin-left:8px;color:var(--error)}
.ccard .row .delta.good{color:var(--success-dark)}
.collapse{margin-left:auto;background:none;border:0;cursor:pointer;width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.collapse:hover{background:var(--level1)}

/* ---------- alert ---------- */
.alert{display:flex;align-items:center;gap:12px;padding:6px 12px;min-height:36px;position:sticky;top:108px;z-index:13;border:1px solid var(--warning);border-left:4px solid var(--warning);border-radius:6px;background:var(--warning-pale)}
.alert b{font-weight:600}
.alert .right{margin-left:auto}

/* ---------- footer ---------- */
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px}
.footer .status{color:var(--text-muted);font-size:13px}
.footer .actions{display:flex;gap:8px}

/* ---------- drawer / modal / menu ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,28,30,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}

<script>

const STORE_KEY='cp-proto-v1';
const fmt=(n,d=2)=>{ if(n===null||n===undefined||isNaN(n)) return '—'; const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return (n<0?'−':'')+s; };

  const P=(code,phase,pdesc,ct,cdesc,um,ci,estCost,actCost,projCost,prevCost,estHours=0,actHours=0,projHours=0,estUnits=0,actUnits=0,projUnits=0,inclCO=0,futureCO=0)=>({

let D=load();
function load(){ try{ const s=localStorage.getItem(STORE_KEY); if(s){ const d=JSON.parse(s); if(!d.drafts){ const seed=seedData(); d.drafts=seed.drafts; d.activeDraft=seed.activeDraft; } if(!d.view) d.view='Thulsi\u2019s project view'; return d; } }catch(e){} return seedData(); }

/* =========================================================
   CALCULATION ENGINE (ports to TypeScript as-is)
   ========================================================= */
const MIN_PCT=20; // minimum % complete before projections apply (company parameter)
function phaseCalc(p){
  const estInc=p.estCost+p.inclCO;
  const pctCost=pct(p.actCost,p.projCost||estInc);
  const pctHours=p.projHours?pct(p.actHours,p.projHours):0;
  const pctUnits=p.projUnits?pct(p.actUnits,p.projUnits):0;
  return {
    estInc, pctCost, pctHours, pctUnits,
    ouCost:p.projCost-estInc, ouHours:p.projHours-p.estHours, ouUnits:p.projUnits-p.estUnits,
    remCost:p.projCost-p.actCost, remHours:p.projHours-p.actHours, remUnits:p.projUnits-p.actUnits,
    held: pct(p.actCost,estInc)<MIN_PCT && !p.mod,
    drift: p.actCost>p.projCost+0.005,
    netChange:p.projCost-(p.prevCost??estInc),
    forecastCost:Math.max(p.projCost,p.actCost), forecastHours:Math.max(p.projHours,p.actHours)
  };
}
function codeCalc(code){
  const ps=D.phases.filter(p=>p.code===code);
  const s=k=>ps.reduce((a,p)=>a+(p[k]||0),0);
  const estInc=s('estCost')+s('inclCO'); const projCost=s('projCost'); const actCost=s('actCost');
  const prevCost=ps.reduce((a,p)=>a+(p.prevCost??p.estCost),0);
  const estHours=s('estHours'), actHours=s('actHours'), projHours=s('projHours'), prevHours=s('prevHours');
  const anyMod=ps.some(p=>p.mod);
  return { phases:ps, estInc, actCost, projCost, prevCost, estHours, actHours, projHours, prevHours,
    pctCost:pct(actCost,projCost||estInc), pctHours:projHours?pct(actHours,projHours):0,
    ouCost:projCost-estInc, ouHours:projHours-estHours, remCost:projCost-actCost, remHours:projHours-actHours,
    forecastCost:Math.max(projCost,actCost), forecastHours:Math.max(projHours,actHours),
    held: pct(actCost,estInc)<MIN_PCT && !anyMod, drift: actCost>projCost+0.005, mod:anyMod,
    inclCO:s('inclCO'), futureCO:s('futureCO'), modBy: anyMod?'Thulsi Priya':'Kellie Medeiros', modDate: anyMod?nowStamp():'23-10-2026 21:10' };
}
function nowStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
// Units drive hours, hours drive cost.
function setPhaseProjCost(p,v){ p.projCost=Math.max(0,v); p.mod=true; p.modBy='Thulsi Priya'; p.modDate=nowStamp(); }
function setPhaseProjHours(p,v){ v=Math.max(0,v); const rate=p.estHours? p.estCost/p.estHours : 0; p.projHours=v; if(rate) p.projCost=round2(v*rate); p.mod=true; p.modDate=nowStamp(); }
function setPhaseProjUnits(p,v){ v=Math.max(0,v); const hpu=p.estUnits? p.estHours/p.estUnits : 0; const cpu=p.estUnits? p.estCost/p.estUnits : 0; p.projUnits=v; if(hpu){ p.projHours=round2(v*hpu); } if(cpu) p.projCost=round2(v*cpu); p.mod=true; p.modDate=nowStamp(); }
// Code-level edit distributes proportionally to phases (by current projected cost; by estimate if all zero)
function setCodeProjCost(code,v){ const ps=D.phases.filter(p=>p.code===code); const total=ps.reduce((a,p)=>a+p.projCost,0)||ps.reduce((a,p)=>a+p.estCost,0); let acc=0; ps.forEach((p,i)=>{ const w=(total? (p.projCost||p.estCost)/total : 1/ps.length); const share = i===ps.length-1 ? v-acc : round2(v*w); acc+=share; setPhaseProjCost(p,share); }); }
function setCodeProjHours(code,v){ const ps=D.phases.filter(p=>p.code===code&&p.estHours>0); const total=ps.reduce((a,p)=>a+p.projHours,0)||ps.reduce((a,p)=>a+p.estHours,0); let acc=0; ps.forEach((p,i)=>{ const w=total?(p.projHours||p.estHours)/total:1/ps.length; const share=i===ps.length-1? v-acc : round2(v*w); acc+=share; setPhaseProjHours(p,share); }); }
const round2=n=>Math.round(n*100)/100;
function contract(){ const codes=D.codes.map(c=>codeCalc(c.code)); const orig=codes.reduce((a,c)=>a+(c.estInc-c.inclCO),0); const cur=codes.reduce((a,c)=>a+c.estInc,0); const proj=codes.reduce((a,c)=>a+c.prevCost,0); const work=codes.reduce((a,c)=>a+c.projCost,0); const rev=D.revenue; const m=(cost)=>({rev,cost,margin:rev-cost,pct:pct(rev-cost,rev)}); return {original:m(orig),current:m(cur),projected:m(proj),working:m(work)}; }
function unassigned(){ return D.phases.filter(p=>!p.code); }

    document.body.style.cursor=isV?'row-resize':'col-resize'; document.body.style.userSelect='none';

  const y=window.scrollY;
  if(y>200 && !collapsed){ collapsed=true; renderDraft(); }
  else if(y<80 && collapsed){ collapsed=false; renderDraft(); }
},{passive:true});

render();
</script>
